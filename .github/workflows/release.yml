name: Attach theme.tar.gz to release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run build
      - name: Pack theme.tar.gz
        run: |
          mkdir -p pkg
          cp theme.json preview.png pkg/
          cp -r dist pkg/
          tar -czf theme.tar.gz -C pkg theme.json preview.png dist
      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: theme.tar.gz
